[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcast"
version = "0.1.0"
description = "CPI nowcast (Model 2): macro baseline, news hook for Model 1 indexes"
readme = "nowcast/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost==3.2.0",  # versión usada en el notebook 03 v1 (reproducibilidad)
    "joblib>=1.3",
    "fredapi>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Solo el paquete nowcast: src/ (Modelo 1), notebooks/, config/ quedan fuera
[tool.setuptools.packages.find]
include = ["nowcast*"]
